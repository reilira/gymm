<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FORJA — Entrenamiento</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root{
    --bg:#17181C; --panel:#1D1E23; --panel2:#25262C; --border:#34353B;
    --text:#EDEBE4; --dim:#93959D; --molten:#FF5A33; --moltenDeep:#C9391A;
    --amber:#FFB020; --sage:#7BD79C;
  }
  * { box-sizing: border-box; margin:0; padding:0; font-family:'Inter',sans-serif; }
  html,body{ background:var(--bg); color:var(--text); }
  select option{ background:var(--panel); color:var(--text); }
  button{ font-family:'Inter',sans-serif; }
  button:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:99px; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .display{ font-family:'Oswald',sans-serif; }

  .app{ width:100%; min-height:100vh; display:flex; }
  .sidebar{ display:flex; flex-direction:column; justify-content:space-between; padding:20px; flex-shrink:0; width:200px; border-right:1px solid var(--border); }
  .brand{ display:flex; align-items:center; gap:8px; margin-bottom:40px; }
  .brand-mark{ width:26px; height:26px; border-radius:6px; background:linear-gradient(160deg,#FFB020,#FF5A33); }
  .brand-name{ font-size:18px; letter-spacing:.04em; }
  .nav{ display:flex; flex-direction:column; gap:4px; }
  .nav-btn{ display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:8px; text-align:left; background:transparent; color:var(--dim); border:none; cursor:pointer; font-size:13px; font-weight:500; }
  .nav-btn.active{ background:var(--panel); color:var(--text); }
  .nav-btn svg{ flex-shrink:0; }
  .profile{ display:flex; align-items:center; gap:8px; }
  .avatar{ width:30px; height:30px; border-radius:99px; background:var(--panel2); border:1px solid var(--border); }
  .profile-name{ font-size:12px; font-weight:600; }
  .profile-sub{ font-size:10px; color:var(--dim); }

  .main{ flex:1; padding:40px; overflow:auto; }
  .screen{ max-width:760px; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; color:var(--amber); font-size:11px; letter-spacing:.18em; text-transform:uppercase; margin-bottom:8px; }
  h1.title{ font-family:'Oswald',sans-serif; font-size:32px; font-weight:600; letter-spacing:.01em; text-transform:uppercase; }
  h1.title.small{ font-size:26px; }
  .subtitle{ color:var(--dim); margin-top:6px; font-size:14px; max-width:520px; }

  .week-strip{ display:flex; gap:8px; margin-top:24px; }
  .day-chip{ flex:1; border-radius:8px; padding:12px 8px; text-align:center; background:var(--panel); border:1px solid var(--border); }
  .day-chip.today{ background:linear-gradient(160deg,#C9391A,#FF5A33); border-color:var(--molten); }
  .day-label{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--dim); font-weight:600; }
  .day-chip.today .day-label{ color:#fff; }
  .day-dot-row{ margin-top:8px; display:flex; justify-content:center; }
  .dot{ width:4px; height:4px; border-radius:99px; background:var(--border); }
  .dot.dim{ background:var(--dim); }

  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:24px; }
  .stat-chip{ display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:8px; background:var(--panel); border:1px solid var(--border); }
  .stat-value{ font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:600; line-height:1; }
  .stat-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; margin-top:4px; }

  .day-tabs{ display:flex; gap:8px; margin-top:28px; flex-wrap:wrap; }
  .day-tab{ padding:8px 14px; border-radius:8px; background:var(--panel); border:1px solid var(--border); color:var(--dim); font-size:12px; font-weight:600; cursor:pointer; font-family:'IBM Plex Mono',monospace; display:flex; align-items:center; gap:6px; }
  .day-tab.active{ background:var(--molten); color:#fff; border-color:var(--molten); }
  .day-tab .today-dot{ width:5px; height:5px; border-radius:99px; background:var(--amber); }
  .day-tab.active .today-dot{ background:#fff; }

  .section-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); letter-spacing:.1em; text-transform:uppercase; margin:24px 0 12px; }
  .picker-row{ display:flex; gap:8px; margin-bottom:16px; }
  .picker-select{ flex:1; padding:8px 12px; border-radius:8px; background:var(--panel); border:1px solid var(--border); color:var(--dim); font-size:13px; outline:none; }
  .picker-select.filled{ color:var(--text); }
  .add-btn{ display:flex; align-items:center; gap:4px; padding:8px 16px; border-radius:8px; flex-shrink:0; background:var(--panel2); color:var(--dim); border:none; font-size:13px; font-weight:600; cursor:default; }
  .add-btn.enabled{ background:var(--molten); color:#fff; cursor:pointer; }

  .exercise-list{ display:flex; flex-direction:column; gap:8px; }
  .exercise-row{ display:flex; align-items:center; gap:16px; padding:10px 14px; border-radius:8px; text-align:left; width:100%; background:var(--panel); border:1px solid var(--border); cursor:pointer; }
  .pictogram-box{ border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; width:56px; height:56px; background:var(--panel2); }
  .ex-name{ font-size:15px; font-weight:600; }
  .ex-sub{ color:var(--dim); font-size:12px; margin-top:2px; }
  .ex-right{ text-align:right; flex-shrink:0; font-family:'IBM Plex Mono',monospace; }
  .ex-right-main{ color:var(--amber); font-size:16px; font-weight:600; }
  .ex-right-sub{ color:var(--dim); font-size:11px; margin-top:2px; }
  .custom-tag{ font-size:9px; color:var(--amber); border:1px solid var(--amber); border-radius:4px; padding:1px 4px; margin-left:6px; letter-spacing:.05em; }

  .back-btn{ display:flex; align-items:center; gap:4px; margin-bottom:20px; color:var(--dim); font-size:13px; background:none; border:none; cursor:pointer; }
  .ex-header{ display:flex; gap:24px; flex-wrap:wrap; }
  .ex-illustration{ flex-shrink:0; border-radius:12px; display:flex; align-items:center; justify-content:center; width:160px; height:190px; background:radial-gradient(circle at 30% 20%,#2A2B31,#1D1E23); border:1px solid var(--border); }
  .ex-info{ flex:1; min-width:240px; }
  .ex-desc{ color:var(--dim); font-size:13px; margin-top:6px; max-width:420px; }
  .ex-stats{ display:flex; gap:12px; margin-top:16px; }
  .ex-stat-num{ color:var(--amber); font-size:20px; font-weight:600; }
  .ex-stat-label{ color:var(--dim); font-size:10px; text-transform:uppercase; }
  .divider-v{ width:1px; background:var(--border); }

  .set-table{ margin-top:32px; border-radius:12px; overflow:hidden; border:1px solid var(--border); }
  .set-head, .set-row{ display:grid; grid-template-columns:0.7fr 1.3fr 0.8fr 1fr 0.8fr; align-items:center; padding:10px 16px; }
  .set-head{ background:var(--panel2); font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; padding:8px 16px; }
  .set-row{ background:var(--panel); border-top:1px solid var(--border); }
  .set-num{ font-family:'IBM Plex Mono',monospace; font-size:14px; }
  .set-prev{ font-family:'IBM Plex Mono',monospace; color:var(--dim); font-size:12px; }
  .set-input{ font-family:'IBM Plex Mono',monospace; padding:4px 8px; border-radius:4px; background:var(--panel2); border:1px solid var(--border); color:var(--amber); font-size:13px; width:90%; }
  .set-done-cell{ display:flex; justify-content:flex-end; }
  .set-check{ display:flex; align-items:center; justify-content:center; border-radius:6px; width:30px; height:30px; background:transparent; border:1.5px solid var(--border); cursor:pointer; }
  .set-check.done{ background:var(--sage); border-color:var(--sage); }
  .set-hint{ display:flex; align-items:center; gap:4px; padding:8px 16px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--dim); border-top:1px solid var(--border); }

  .timer-card{ margin-top:24px; display:flex; align-items:center; gap:20px; padding:20px; border-radius:12px; background:var(--panel); border:1px solid var(--border); flex-wrap:wrap; }
  .timer-ring-wrap{ position:relative; width:84px; height:84px; }
  .timer-text{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600; }
  .timer-info{ flex:1; min-width:140px; }
  .timer-title{ font-size:14px; font-weight:600; }
  .timer-sub{ color:var(--dim); font-size:12px; margin-top:2px; }
  .timer-btn{ display:flex; align-items:center; gap:8px; padding:8px 16px; border-radius:8px; background:var(--molten); color:#fff; border:none; font-size:13px; font-weight:600; cursor:pointer; }
  .timer-btn.resting{ background:var(--panel2); color:var(--text); }
  .reset-btn{ background:none; border:none; cursor:pointer; color:var(--dim); }

  .chart-card{ margin-top:32px; padding:20px; border-radius:12px; background:var(--panel); border:1px solid var(--border); }
  .chart-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  .chart-title{ font-size:14px; font-weight:600; }
  .chart-value{ font-family:'IBM Plex Mono',monospace; color:var(--amber); font-size:20px; font-weight:600; }

  .record-row{ display:flex; align-items:center; gap:16px; padding:10px 14px; border-radius:8px; background:var(--panel); border:1px solid var(--border); }
  .record-name{ font-size:14px; font-weight:600; }
  .record-date{ color:var(--dim); font-size:11px; margin-top:2px; }
  .pr-badge{ display:flex; align-items:center; gap:4px; padding:4px 8px; border-radius:4px; background:rgba(255,90,51,.12); }
  .pr-text{ font-family:'IBM Plex Mono',monospace; color:var(--molten); font-size:10px; font-weight:700; }
  .record-weight{ font-family:'IBM Plex Mono',monospace; color:var(--amber); font-size:16px; font-weight:600; min-width:70px; text-align:right; }

  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:16px; }
  .cal-dow-row{ margin-top:24px; }
  .cal-dow{ text-align:center; font-size:10px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; padding-bottom:4px; }
  .cal-cell{ border-radius:8px; padding:8px 6px; background:var(--panel); border:1px solid var(--border); min-height:64px; display:flex; flex-direction:column; gap:4px; }
  .cal-cell.empty{ background:transparent; border:none; }
  .cal-cell.today{ background:linear-gradient(160deg,#C9391A,#FF5A33); border-color:var(--molten); }
  .cal-num{ font-size:12px; font-weight:600; }
  .cal-cell.today .cal-num{ color:#fff; }
  .cal-focus{ font-size:10px; color:var(--dim); line-height:1.2; flex:1; }
  .cal-cell.today .cal-focus{ color:rgba(255,255,255,.85); }
  .cal-dot-row{ display:flex; }

  .legend-row{ display:flex; gap:16px; margin-top:16px; flex-wrap:wrap; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dim); font-family:'IBM Plex Mono',monospace; }
  .legend-swatch{ width:10px; height:10px; border-radius:3px; }

  @media (max-width:640px){ .sidebar{ display:none; } .main{ padding:24px; } .cal-focus{ display:none; } .cal-cell{ min-height:auto; } }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<script>
/* ============== ICONS (UI, no muscle content) ============== */
const ICONS = {
  chevronLeft: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`,
  flame: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.5-2-1-3 2 1 3 3 3 6a6 6 0 0 1-12 0c0-4 2-6 4-10z"/></svg>`,
  dumbbell: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M4 8l3-3M20 16l-3 3M2 12l2-2M20 12l2 2M8.5 4.5l-2 2M15.5 19.5l2-2"/></svg>`,
  trendingUp: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,
  layoutGrid: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>`,
  calendar: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
  trophy: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3a2 2 0 0 1-2 4M7 5H4a2 2 0 0 0 2 4"/></svg>`,
  play: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
  pause: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`,
  rotateCcw: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>`,
  check: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  plus: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  pencil: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>`,
};

/* ============== ANATOMICAL PICTOGRAM (silueta con grupo muscular resaltado) ============== */
let gradCounter = 0;
function nextGradId(){ return 'moltenGrad' + (gradCounter++); }

const PARTS_FRONT = [
  {id:'head',      el:`<circle cx="30" cy="10" r="8" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'neck',      el:`<rect x="27" y="17" width="6" height="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1"/>`},
  {id:'chest',     el:`<path d="M18,21 L42,21 L40,35 L20,35 Z" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'abs',       el:`<path d="M20,35 L40,35 L38,50 L22,50 Z" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'shoulderL', el:`<circle cx="14" cy="23" r="6" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'shoulderR', el:`<circle cx="46" cy="23" r="6" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'bicepL',    el:`<rect x="7" y="27" width="8" height="18" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'bicepR',    el:`<rect x="45" y="27" width="8" height="18" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'forearmL',  el:`<rect x="6" y="45" width="7" height="16" rx="3" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'forearmR',  el:`<rect x="47" y="45" width="7" height="16" rx="3" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'adductorL', el:`<path d="M27,50 L30,50 L29,60 L27.5,60 Z" fill="__FILL__" stroke="__STROKE__" stroke-width="1.2"/>`},
  {id:'adductorR', el:`<path d="M30,50 L33,50 L32.5,60 L31,60 Z" fill="__FILL__" stroke="__STROKE__" stroke-width="1.2"/>`},
  {id:'quadL',     el:`<rect x="19" y="50" width="9" height="24" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'quadR',     el:`<rect x="32" y="50" width="9" height="24" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'calfL',     el:`<rect x="20" y="76" width="7" height="20" rx="3" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'calfR',     el:`<rect x="33" y="76" width="7" height="20" rx="3" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
];

const PARTS_BACK = [
  {id:'head',      el:`<circle cx="30" cy="10" r="8" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'neck',      el:`<rect x="27" y="17" width="6" height="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1"/>`},
  {id:'back',      el:`<path d="M16,21 L44,21 L40,44 L20,44 Z" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'shoulderL', el:`<circle cx="14" cy="23" r="6" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'shoulderR', el:`<circle cx="46" cy="23" r="6" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'tricepL',   el:`<rect x="7" y="27" width="8" height="18" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'tricepR',   el:`<rect x="45" y="27" width="8" height="18" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'forearmL',  el:`<rect x="6" y="45" width="7" height="16" rx="3" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'forearmR',  el:`<rect x="47" y="45" width="7" height="16" rx="3" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'glutes',    el:`<path d="M20,44 L40,44 L38,54 L22,54 Z" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'hamL',      el:`<rect x="19" y="54" width="9" height="20" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'hamR',      el:`<rect x="32" y="54" width="9" height="20" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'calfL',     el:`<rect x="20" y="76" width="7" height="20" rx="3" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'calfR',     el:`<rect x="33" y="76" width="7" height="20" rx="3" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
];

function bodyFigure(view, highlights=[], size=56){
  const gid = nextGradId();
  const parts = view === 'back' ? PARTS_BACK : PARTS_FRONT;
  const shapes = parts.map(p=>{
    const hi = highlights.includes(p.id);
    const fill = hi ? `url(#${gid})` : 'var(--panel2)';
    const stroke = hi ? 'none' : 'var(--border)';
    return p.el.replaceAll('__FILL__', fill).replaceAll('__STROKE__', stroke);
  }).join('');
  const h = Math.round(size * 100 / 60);
  return `<svg viewBox="0 0 60 100" width="${size}" height="${h}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFB020"/><stop offset="100%" stop-color="#FF5A33"/></linearGradient></defs>
    ${shapes}
  </svg>`;
}

const MUSCLE_LABELS = {

          </div>
        </div>
      </div>

      <div class="set-table">
        <div class="set-head">Serie<span>Anterior</span><span>Reps</span><span>Peso</span><span style="text-align:right">Hecha</span></div>

          <svg width="84" height="84" style="transform:rotate(-90deg)">

              stroke-dasharray="${2*Math.PI*36}"
              stroke-dashoffset="${state.resting ? (1-state.secondsLeft/REST_TOTAL)*2*Math.PI*36 : 0}"
              stroke-linecap="round" style="transition:stroke-dashoffset 1s linear"/>
          </svg>
          <div class="timer-text mono" id="timerText">${state.secondsLeft}s</div>
        </div>
        <div class="timer-info">
          <div class="timer-title">Descanso entre series</div>
          <div class="timer-sub">90 segundos recomendados para esta carga</div>
        </div>
        <button type="button" class="timer-btn ${state.resting?'resting':''}" id="timerBtn">

    state.screen = 'plan';

  document.querySelectorAll('[data-set-field]').forEach(input=>{
    input.addEventListener('input', ()=>{
      const i = Number(input.dataset.setIndex);

      log.rows[i][field] = input.value;

    btn.addEventListener('click', ()=>{

      log.done = wasDone ? log.done.filter(x=>x!==i) : [...log.done, i];
      if(!wasDone){ state.secondsLeft = REST_TOTAL; startTimer(); }
      render();
    });
  });

  document.getElementById('timerBtn').addEventListener('click', ()=>{
    if(state.resting){ pauseTimer(); } else { if(state.secondsLeft===0) state.secondsLeft = REST_TOTAL; startTimer(); }
    render();
  });
  document.getElementById('timerReset').addEventListener('click', ()=>{
    pauseTimer(); state.secondsLeft = REST_TOTAL; render();
  });
}

function startTimer(){
  clearInterval(timerInterval);
  state.resting = true;
  timerInterval = setInterval(()=>{
    state.secondsLeft -= 1;
    if(state.secondsLeft <= 0){
      clearInterval(timerInterval);
      state.resting = false; state.secondsLeft = REST_TOTAL;
      render();
      return;
    }
    updateTimerDOM();
  }, 1000);
}
function pauseTimer(){ clearInterval(timerInterval); state.resting = false; }
function updateTimerDOM(){
  const ring = document.getElementById('timerRing');
  const text = document.getElementById('timerText');
  if(!ring || !text) return;
  const circumference = 2*Math.PI*36;
  ring.setAttribute('stroke-dashoffset', (1 - state.secondsLeft/REST_TOTAL) * circumference);
  text.textContent = state.secondsLeft + 's';
}

}

/* ============== RENDER: PROGRESO ============== */
function miniLineChart(data, labels){
  const w=560, h=180, pad=30;
  const min = Math.min(...data)-5, max = Math.max(...data)+5;
  const stepX = (w-pad*2)/(data.length-1);
  const pts = data.map((v,i)=>{
    const x = pad + i*stepX;
    const y = h-pad-((v-min)/(max-min))*(h-pad*2);
    return [x,y];
  });
  const pathD = pts.map((p,i)=> i===0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`).join(' ');
  const gridLines = [0.25,0.5,0.75].map(f=>`<line x1="${pad}" x2="${w-pad}" y1="${pad+f*(h-pad*2)}" y2="${pad+f*(h-pad*2)}" stroke="#34353B" stroke-width="1"/>`).join('');
  const dots = pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#FFB020"/>`).join('');
  const labelsHtml = labels.map((l,i)=>`<text x="${pts[i][0]}" y="${h-8}" font-size="10" fill="#93959D" text-anchor="middle" font-family="'IBM Plex Mono',monospace">${l}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    ${gridLines}
    <path d="${pathD}" fill="none" stroke="#FF5A33" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${labelsHtml}
  </svg>`;
}

function renderProgreso(){
  const recordsHtml = records.map(r=>`
    <div class="record-row">
      <div class="pictogram-box" style="width:44px;height:44px;">${bodyFigure(r.view, r.highlight, 30)}</div>
      <div style="flex:1;">
        <div class="record-name">${r.name}</div>
        <div class="record-date">${r.date}</div>
      </div>
      ${r.isPR ? `<div class="pr-badge">${ICONS.trophy('#FF5A33',11)}<span class="pr-text">PR</span></div>` : ''}
      <div class="record-weight">${r.weight}</div>
    </div>
  `).join('');

  document.getElementById('main').innerHTML = `
    <div class="screen">
      <div class="eyebrow">Historial</div>
      <h1 class="display title">Progreso &amp; récords</h1>
      <p class="subtitle">8 semanas de entrenamiento registradas.</p>

      <div class="stat-grid">
        <div class="stat-chip">${ICONS.trophy('#FF5A33',18)}<div><div class="stat-value mono">3</div><div class="stat-label">PRs este mes</div></div></div>
        <div class="stat-chip">${ICONS.dumbbell('#FF5A33',18)}<div><div class="stat-value mono">24</div><div class="stat-label">Sesiones</div></div></div>
        <div class="stat-chip">${ICONS.trendingUp('#FF5A33',18)}<div><div class="stat-value mono">+12%</div><div class="stat-label">RM +30 días</div></div></div>
      </div>

      <div class="chart-card">
        <div class="chart-head"><div class="chart-title">1RM estimado — Sentadilla</div><div class="chart-value">140 kg</div></div>
        ${miniLineChart(progressData, progressLabels)}
      </div>

      <div class="section-label">Récords personales</div>
      <div class="exercise-list">${recordsHtml}</div>
    </div>
  `;
}

/* ============== MAIN RENDER ============== */
function render(){
  renderSidebar();
  if(state.screen === 'plan') renderPlan();
  else if(state.screen === 'exercise') renderExercise();
  else if(state.screen === 'calendario') renderCalendario();
  else if(state.screen === 'progreso') renderProgreso();
}

render();
</script>
</body>
</html>
