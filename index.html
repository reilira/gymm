<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FORJA — Dashboard Integral</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root {
    --bg: #17181C;
    --panel: #1D1E23;
    --panel2: #25262C;
    --border: #34353B;
    --text: #EDEBE4;
    --dim: #93959D;
    --molten: #FF5A33;
    --moltenDeep: #C9391A;
    --amber: #FFB020;
    --sage: #7BD79C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  html, body { background: var(--bg); color: var(--text); min-height: 100vh; }
  select option { background: var(--panel); color: var(--text); }
  button { font-family: 'Inter', sans-serif; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .display { font-family: 'Oswald', sans-serif; }

  .app { width: 100%; min-height: 100vh; display: flex; }
  
  /* SIDEBAR NAV */
  .sidebar { display: flex; flex-direction: column; justify-content: space-between; padding: 20px; flex-shrink: 0; width: 230px; border-right: 1px solid var(--border); background: var(--bg); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
  .brand-mark { width: 24px; height: 24px; border-radius: 6px; background: linear-gradient(160deg, var(--amber), var(--molten)); }
  .brand-name { font-size: 20px; letter-spacing: .05em; font-weight: 700; }
  .nav { display: flex; flex-direction: column; gap: 6px; }
  .nav-btn { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; text-align: left; background: transparent; color: var(--dim); border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s ease; }
  .nav-btn:hover { color: var(--text); background: var(--panel2); }
  .nav-btn.active { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  .nav-btn svg { flex-shrink: 0; }
  .profile { display: flex; align-items: center; gap: 10px; padding-top: 16px; border-top: 1px solid var(--border); }
  .avatar { width: 32px; height: 32px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--amber); }
  .profile-name { font-size: 13px; font-weight: 600; }
  .profile-sub { font-size: 10px; color: var(--dim); }

  /* MAIN LAYOUT */
  .main { flex: 1; padding: 40px; overflow: auto; }
  .screen { max-width: 820px; margin: 0 auto; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; color: var(--amber); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 8px; }
  h1.title { font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 600; letter-spacing: .01em; text-transform: uppercase; }
  h1.title.small { font-size: 26px; }
  .subtitle { color: var(--dim); margin-top: 6px; font-size: 14px; max-width: 560px; line-height: 1.5; }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; }
  .stat-chip { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 8px; background: var(--panel); border: 1px solid var(--border); }
  .stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; line-height: 1; }
  .stat-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }

  .section-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; margin: 28px 0 12px; }

  /* ENTRENAMIENTO COMPONENT */
  .day-tabs { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .day-tab { padding: 10px 16px; border-radius: 8px; background: var(--panel); border: 1px solid var(--border); color: var(--dim); font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'IBM Plex Mono', monospace; transition: all 0.2s ease; }
  .day-tab:hover { color: var(--text); }
  .day-tab.active { background: var(--molten); color: #fff; border-color: var(--molten); }

  .exercise-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .exercise-row { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-radius: 10px; text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--border); cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease; }
  .exercise-row:hover { transform: translateY(-1px); border-color: var(--dim); }
  .pictogram-box { border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 56px; height: 56px; background: var(--panel2); }
  .ex-name { font-size: 15px; font-weight: 600; }
  .ex-sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .ex-right { text-align: right; flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; }
  .ex-right-main { color: var(--amber); font-size: 15px; font-weight: 600; }
  .ex-right-sub { color: var(--dim); font-size: 11px; margin-top: 2px; }

  /* EXERCISE DETAIL & TIMER */
  .back-btn { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; color: var(--dim); font-size: 13px; background: none; border: none; cursor: pointer; font-weight: 500; }
  .back-btn:hover { color: var(--text); }
  .ex-header { display: flex; gap: 24px; flex-wrap: wrap; background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
  .ex-illustration { flex-shrink: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; width: 120px; height: 140px; background: radial-gradient(circle at 30% 20%, #2A2B31, #1D1E23); border: 1px solid var(--border); }
  .ex-info { flex: 1; min-width: 240px; }

  .set-table { margin-top: 24px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--panel); }
  .set-head, .set-row { display: grid; grid-template-columns: 0.6fr 1.2fr 1fr 1fr 0.6fr; align-items: center; padding: 12px 16px; }
  .set-head { background: var(--panel2); font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .set-row { border-top: 1px solid var(--border); }
  .set-num { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--dim); }
  .set-prev { font-family: 'IBM Plex Mono', monospace; color: var(--dim); font-size: 12px; }
  .set-input { font-family: 'IBM Plex Mono', monospace; padding: 6px 10px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--border); color: var(--amber); font-size: 13px; width: 85%; outline: none; }
  .set-input:focus { border-color: var(--amber); }
  .set-done-cell { display: flex; justify-content: flex-end; }
  .set-check { display: flex; align-items: center; justify-content: center; border-radius: 6px; width: 32px; height: 32px; background: transparent; border: 1.5px solid var(--border); cursor: pointer; transition: all 0.2s ease; }
  .set-check.done { background: var(--sage); border-color: var(--sage); }

  .timer-card { margin-top: 24px; display: flex; align-items: center; gap: 20px; padding: 20px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); flex-wrap: wrap; }
  .timer-ring-wrap { position: relative; width: 72px; height: 72px; flex-shrink: 0; }
  .timer-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; }
  .timer-info { flex: 1; min-width: 160px; }
  .timer-title { font-size: 14px; font-weight: 600; }
  .timer-sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .timer-controls { display: flex; gap: 8px; align-items: center; }
  .timer-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: var(--molten); color: #fff; border: none; font-size: 12px; font-weight: 600; cursor: pointer; }
  .timer-btn.resting { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .reset-btn { background: none; border: none; cursor: pointer; color: var(--dim); padding: 6px; }
  .reset-btn:hover { color: var(--text); }

  /* HÁBITOS COMPONENT */
  .habit-card { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); margin-bottom: 10px; }
  .habit-title { font-size: 15px; font-weight: 600; }
  .habit-sub { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .habit-streak { font-family: 'IBM Plex Mono', monospace; color: var(--amber); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }

  /* MEMENTO MORI COMPONENT */
  .memento-container { background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-top: 16px; }
  .memento-grid { display: grid; grid-template-columns: repeat(52, 1fr); gap: 3px; }
  .memento-block { aspect-ratio: 1; border-radius: 1px; background: var(--panel2); }
  .memento-block.lived { background: var(--molten); }
  .memento-block.current { background: var(--amber); }

  /* FINANZAS COMPONENT */
  .fin-card { padding: 16px 20px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .fin-title { font-size: 14px; font-weight: 600; }
  .fin-sub { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .fin-amount { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; }
  .fin-amount.pos { color: var(--sage); }
  .fin-amount.neg { color: var(--molten); }

  @media (max-width: 680px) {
    .sidebar { display: none; }
    .main { padding: 20px; }
    .memento-grid { grid-template-columns: repeat(26, 1fr); }
    .stat-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<script>
/* ============== ICONOS SVGs ============== */
const ICONS = {
  dumbbell: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><path d="M6.5 6.5l11 11M4 8l3-3M20 16l-3 3M2 12l2-2M20 12l2 2M8.5 4.5l-2 2M15.5 19.5l2-2"/></svg>`,
  checkCircle: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
  clock: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
  dollar: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`,
  flame: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.5-2-1-3 2 1 3 3 3 6a6 6 0 0 1-12 0c0-4 2-6 4-10z"/></svg>`,
  chevronLeft: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>`,
  play: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
  pause: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`,
  rotateCcw: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>`,
  check: (c='currentColor',s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`
};

/* ============== PICTOGRAM SVG DINÁMICO ============== */
let gradCounter = 0;
function nextGradId() { return 'moltenGrad' + (gradCounter++); }
const PARTS_FRONT = [
  {id:'head', el:`<circle cx="30" cy="10" r="8" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'chest', el:`<path d="M18,21 L42,21 L40,35 L20,35 Z" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'shoulderL', el:`<circle cx="14" cy="23" r="6" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'shoulderR', el:`<circle cx="46" cy="23" r="6" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'bicepL', el:`<rect x="7" y="27" width="8" height="18" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'bicepR', el:`<rect x="45" y="27" width="8" height="18" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'quadL', el:`<rect x="19" y="50" width="9" height="24" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'quadR', el:`<rect x="32" y="50" width="9" height="24" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`}
];
const PARTS_BACK = [
  {id:'head', el:`<circle cx="30" cy="10" r="8" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'back', el:`<path d="M16,21 L44,21 L40,44 L20,44 Z" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'tricepL', el:`<rect x="7" y="27" width="8" height="18" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'tricepR', el:`<rect x="45" y="27" width="8" height="18" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'glutes', el:`<path d="M20,44 L40,44 L38,54 L22,54 Z" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'hamL', el:`<rect x="19" y="54" width="9" height="20" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'hamR', el:`<rect x="32" y="54" width="9" height="20" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`}
];

function bodyFigure(view, highlights=[], size=56) {
  const gid = nextGradId();
  const parts = view === 'back' ? PARTS_BACK : PARTS_FRONT;
  const shapes = parts.map(p => {
    const hi = highlights.includes(p.id);
    const fill = hi ? `url(#${gid})` : 'var(--panel2)';
    const stroke = hi ? 'none' : 'var(--border)';
    return p.el.replaceAll('__FILL__', fill).replaceAll('__STROKE__', stroke);
  }).join('');
  return `<svg viewBox="0 0 60 100" width="${size}" height="${Math.round(size*1.6)}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFB020"/><stop offset="100%" stop-color="#FF5A33"/></linearGradient></defs>
    ${shapes}
  </svg>`;
}

/* ============== DATASOURCE INTEGRADO ============== */
const routineDays = [
  { id: 1, label: 'Día 1', title: 'Pecho y Tríceps', eyebrow: 'Empuje', exercises: [
    { id: 'd1e0', name: 'Press de Banca Plano', muscleLabel: 'Pecho', view: 'front', highlight: ['chest'], equip: 'Barra', sets: 4, reps: '10', weight: '60 kg', prevBest: '57.5 kg × 12' },
    { id: 'd1e1', name: 'Tríceps en Polea Alta', muscleLabel: 'Tríceps', view: 'back', highlight: ['tricepL','tricepR'], equip: 'Polea', sets: 3, reps: '12', weight: '25 kg', prevBest: '22.5 kg × 12' }
  ]},
  { id: 2, label: 'Día 2', title: 'Espalda y Bíceps', eyebrow: 'Tracción', exercises: [
    { id: 'd2e0', name: 'Remo con Barra', muscleLabel: 'Espalda', view: 'back', highlight: ['back'], equip: 'Barra', sets: 4, reps: '10', weight: '50 kg', prevBest: '45 kg × 10' },
    { id: 'd2e1', name: 'Curl de Bíceps', muscleLabel: 'Bíceps', view: 'front', highlight: ['bicepL','bicepR'], equip: 'Mancuernas', sets: 3, reps: '12', weight: '14 kg', prevBest: '12 kg × 12' }
  ]},
  { id: 3, label: 'Día 3', title: 'Pierna Completa', eyebrow: 'Inferior', exercises: [
    { id: 'd3e0', name: 'Sentadilla Trasera', muscleLabel: 'Cuádriceps', view: 'front', highlight: ['quadL','quadR'], equip: 'Barra', sets: 4, reps: '8', weight: '80 kg', prevBest: '75 kg × 10' },
    { id: 'd3e1', name: 'Peso Muerto Rumano', muscleLabel: 'Isquios', view: 'back', highlight: ['hamL','hamR','glutes'], equip: 'Barra', sets: 3, reps: '10', weight: '70 kg', prevBest: '65 kg × 10' }
  ]},
  { id: 4, label: 'Día 4', title: 'Hombro y Trapecio', eyebrow: 'Vertical', exercises: [
    { id: 'd4e0', name: 'Press Militar', muscleLabel: 'Hombros', view: 'front', highlight: ['shoulderL','shoulderR'], equip: 'Barra', sets: 4, reps: '10', weight: '40 kg', prevBest: '35 kg × 10' }
  ]},
  { id: 5, label: 'Día 5', title: 'Full Body / Core', eyebrow: 'Funcional', exercises: [
    { id: 'd5e0', name: 'Dominadas Asistidas', muscleLabel: 'Espalda', view: 'back', highlight: ['back'], equip: 'Corporal', sets: 3, reps: '8', weight: 'BW', prevBest: 'BW × 8' }
  ]}
];

const habitsData = [
  { id: 1, name: 'Lectura Técnica / Programación', sub: '30 minutos diarios de código o docs', streak: 14, done: true },
  { id: 2, name: 'Meditación / Estoicismo', sub: '10 min de reflexión al despertar', streak: 8, done: false },
  { id: 3, name: 'Sesión de Entrenamiento', sub: 'Completar rutina asignada en FORJA', streak: 18, done: true },
  { id: 4, name: 'Hidratación (3 Litros)', sub: 'Monitoreo de consumo de agua', streak: 5, done: false }
];

const finData = [
  { id: 1, title: 'Servicios de Desarrollo Web', sub: 'Proyecto PHP / MySQL', amount: '+$1,200.00', type: 'pos' },
  { id: 2, title: 'Servidor VPS & Infraestructura', sub: 'Mantenimiento mensual', amount: '-$45.00', type: 'neg' },
  { id: 3, title: 'Suscripción Gimnasio', sub: 'Membresía mensual', amount: '-$35.00', type: 'neg' }
];

/* ============== ESTADO GLOBAL ============== */
const state = {
  screen: 'entrenamiento',
  activeDayId: 1,
  activeExerciseId: null,
  resting: false,
  secondsLeft: 90,
  timerTotal: 90
};

let timerInterval = null;

/* ============== TIMER ENGINE ============== */
function toggleTimer() {
  if (state.resting) {
    clearInterval(timerInterval);
    state.resting = false;
  } else {
    state.resting = true;
    timerInterval = setInterval(() => {
      if (state.secondsLeft > 0) {
        state.secondsLeft--;
        renderTimerUI();
      } else {
        clearInterval(timerInterval);
        state.resting = false;
        state.secondsLeft = state.timerTotal;
        renderTimerUI();
      }
    }, 1000);
  }
  renderTimerUI();
}

function resetTimer() {
  clearInterval(timerInterval);
  state.resting = false;
  state.secondsLeft = state.timerTotal;
  renderTimerUI();
}

function renderTimerUI() {
  const el = document.getElementById('timerContainer');
  if (!el) return;
  
  const m = Math.floor(state.secondsLeft / 60).toString().padStart(2, '0');
  const s = (state.secondsLeft % 60).toString().padStart(2, '0');
  const pct = (state.secondsLeft / state.timerTotal) * 100;
  
  el.innerHTML = `
    <div class="timer-ring-wrap">
      <svg width="72" height="72" viewBox="0 0 36 36">
        <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--panel2)" stroke-width="3" />
        <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="var(--molten)" stroke-width="3" stroke-dasharray="${pct}, 100" />
      </svg>
      <div class="timer-text">${m}:${s}</div>
    </div>
    <div class="timer-info">
      <div class="timer-title">Descanso Activo</div>
      <div class="timer-sub">Siguiente serie en preparación</div>
    </div>
    <div class="timer-controls">
      <button class="timer-btn ${state.resting ? 'resting' : ''}" id="toggleTimerBtn">
        ${state.resting ? ICONS.pause('#EDEBE4', 14) + ' Pausar' : ICONS.play('#FFFFFF', 14) + ' Iniciar 90s'}
      </button>
      <button class="reset-btn" id="resetTimerBtn">${ICONS.rotateCcw('var(--dim)', 16)}</button>
    </div>
  `;

  document.getElementById('toggleTimerBtn').addEventListener('click', toggleTimer);
  document.getElementById('resetTimerBtn').addEventListener('click', resetTimer);
}

/* ============== RENDERS DE NAVEGACIÓN Y PANTALLAS ============== */
function renderSidebar() {
  const navItems = [
    { id: 'entrenamiento', label: 'Entrenamiento', icon: ICONS.dumbbell },
    { id: 'habitos', label: 'Hábitos', icon: ICONS.checkCircle },
    { id: 'memento', label: 'Memento Mori', icon: ICONS.clock },
    { id: 'finanzas', label: 'Finanzas', icon: ICONS.dollar },
  ];
  const navHtml = navItems.map(item => {
    const active = state.screen === item.id || (item.id === 'entrenamiento' && state.screen === 'exercise');
    return `<button type="button" class="nav-btn ${active ? 'active' : ''}" data-nav="${item.id}">
      ${item.icon(active ? '#FF5A33' : '#93959D', 16)} ${item.label}
    </button>`;
  }).join('');

  document.getElementById('sidebar').innerHTML = `
    <div>
      <div class="brand"><div class="brand-mark"></div><span class="display brand-name">FORJA</span></div>
      <div class="nav">${navHtml}</div>
    </div>
    <div class="profile">
      <div class="avatar">F</div>
      <div><div class="profile-name">Usuario</div><div class="profile-sub">Sistema Activo</div></div>
    </div>
  `;

  document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.addEventListener('click', () => { state.screen = btn.dataset.nav; render(); });
  });
}

function renderEntrenamiento() {
  const day = routineDays.find(d => d.id === state.activeDayId) || routineDays[0];
  const tabsHtml = routineDays.map(d => `
    <button type="button" class="day-tab ${d.id === state.activeDayId ? 'active' : ''}" data-day="${d.id}">${d.label}</button>
  `).join('');

  const exListHtml = day.exercises.map(ex => `
    <button type="button" class="exercise-row" data-ex="${ex.id}">
      <div class="pictogram-box">${bodyFigure(ex.view, ex.highlight, 36)}</div>
      <div style="flex:1;">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-sub">${ex.muscleLabel} · ${ex.equip}</div>
      </div>
      <div class="ex-right">
        <div class="ex-right-main">${ex.sets} Series</div>
        <div class="ex-right-sub">${ex.reps} reps</div>
      </div>
    </button>
  `).join('');

  document.getElementById('main').innerHTML = `
    <div class="screen">
      <div class="eyebrow">${day.eyebrow}</div>
      <h1 class="display title">${day.title}</h1>
      <div class="day-tabs">${tabsHtml}</div>
      <div class="section-label">Ejercicios Programados</div>
      <div class="exercise-list">${exListHtml}</div>
    </div>
  `;

  document.querySelectorAll('[data-day]').forEach(btn => {
    btn.addEventListener('click', () => { state.activeDayId = Number(btn.dataset.day); render(); });
  });
  document.querySelectorAll('[data-ex]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeExerciseId = btn.dataset.ex;
      state.screen = 'exercise';
      render();
    });
  });
}

function renderExerciseDetail() {
  const day = routineDays.find(d => d.id === state.activeDayId);
  const ex = day.exercises.find(e => e.id === state.activeExerciseId);

  let setsRowsHtml = '';
  for (let i = 1; i <= ex.sets; i++) {
    setsRowsHtml += `
      <div class="set-row">
        <div class="set-num mono">0${i}</div>
        <div class="set-prev">${ex.prevBest}</div>
        <div><input class="set-input" value="${ex.reps}" /></div>
        <div><input class="set-input" value="${ex.weight}" /></div>
        <div class="set-done-cell">
          <button class="set-check" onclick="this.classList.toggle('done')">${ICONS.check('#1D1E23', 14)}</button>
        </div>
      </div>
    `;
  }

  document.getElementById('main').innerHTML = `
    <div class="screen">
      <button type="button" class="back-btn" id="backBtn">${ICONS.chevronLeft()} Volver a rutina</button>
      <div class="ex-header">
        <div class="ex-illustration">${bodyFigure(ex.view, ex.highlight, 72)}</div>
        <div class="ex-info">
          <div class="eyebrow">${ex.muscleLabel}</div>
          <h1 class="display title small">${ex.name}</h1>
          <p class="subtitle">Equipo: ${ex.equip} · Record previo: ${ex.prevBest}</p>
        </div>
      </div>

      <div class="set-table">
        <div class="set-head">
          <span>Serie</span>
          <span>Previo</span>
          <span>Reps</span>
          <span>Peso</span>
          <span style="text-align:right;">Estado</span>
        </div>
        ${setsRowsHtml}
      </div>

      <div class="timer-card" id="timerContainer"></div>
    </div>
  `;

  document.getElementById('backBtn').addEventListener('click', () => { state.screen = 'entrenamiento'; render(); });
  renderTimerUI();
}

function renderHabitos() {
  const listHtml = habitsData.map(h => `
    <div class="habit-card">
      <div>
        <div class="habit-title">${h.name}</div>
        <div class="habit-sub">${h.sub}</div>
      </div>
      <div style="display:flex; align-items:center; gap:16px;">
        <div class="habit-streak">${ICONS.flame('#FFB020', 14)} ${h.streak}d</div>
        <button class="set-check ${h.done ? 'done' : ''}" data-habit="${h.id}">${h.done ? ICONS.check('#1D1E23', 14) : ''}</button>
      </div>
    </div>
  `).join('');

  document.getElementById('main').innerHTML = `
    <div class="screen">
      <div class="eyebrow">Disciplina Diaria</div>
      <h1 class="display title">Seguimiento de Hábitos</h1>
      <p class="subtitle">Monitoreo constante de acciones clave para mantener la racha.</p>
      <div class="section-label">Hábitos Activos</div>
      <div>${listHtml}</div>
    </div>
  `;

  document.querySelectorAll('[data-habit]').forEach(btn => {
    btn.addEventListener('click', () => {
      const h = habitsData.find(x => x.id === Number(btn.dataset.habit));
      h.done = !h.done;
      render();
    });
  });
}

function renderMemento() {
  const totalWeeks = 80 * 52;
  const livedWeeks = 28 * 52; // Ejemplo base de 28 años
  let blocksHtml = '';
  for (let i = 0; i < totalWeeks; i++) {
    const cls = i < livedWeeks ? 'lived' : (i === livedWeeks ? 'current' : '');
    blocksHtml += `<div class="memento-block ${cls}"></div>`;
  }

  document.getElementById('main').innerHTML = `
    <div class="screen">
      <div class="eyebrow">Perspectiva Estoica</div>
      <h1 class="display title">Memento Mori</h1>
      <p class="subtitle">Cada bloque representa una semana en una expectativa de vida de 80 años. Lo transcurrido se marca en fuego.</p>
      <div class="memento-container">
        <div class="memento-grid">${blocksHtml}</div>
      </div>
    </div>
  `;
}

function renderFinanzas() {
  const listHtml = finData.map(f => `
    <div class="fin-card">
      <div>
        <div class="fin-title">${f.title}</div>
        <div class="fin-sub">${f.sub}</div>
      </div>
      <div class="fin-amount ${f.type}">${f.amount}</div>
    </div>
  `).join('');

  document.getElementById('main').innerHTML = `
    <div class="screen">
      <div class="eyebrow">Control de Recursos</div>
      <h1 class="display title">Finanzas Personales</h1>
      <div class="stat-grid">
        <div class="stat-chip">
          <div>
            <div class="stat-value mono">$1,120.00</div>
            <div class="stat-label">Balance Neto</div>
          </div>
        </div>
        <div class="stat-chip">
          <div>
            <div class="stat-value mono" style="color:var(--sage);">$1,200.00</div>
            <div class="stat-label">Ingresos</div>
          </div>
        </div>
        <div class="stat-chip">
          <div>
            <div class="stat-value mono" style="color:var(--molten);">$80.00</div>
            <div class="stat-label">Gastos</div>
          </div>
        </div>
      </div>
      <div class="section-label">Movimientos Recientes</div>
      <div>${listHtml}</div>
    </div>
  `;
}

function render() {
  renderSidebar();
  if (state.screen === 'entrenamiento') renderEntrenamiento();
  else if (state.screen === 'exercise') renderExerciseDetail();
  else if (state.screen === 'habitos') renderHabitos();
  else if (state.screen === 'memento') renderMemento();
  else if (state.screen === 'finanzas') renderFinanzas();
}

render();
</script>
</body>
</html>
