<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FORJA — Rutina semanal</title>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
  :root{
    --bg:#17181C; --panel:#1D1E23; --panel2:#25262C; --border:#34353B;
    --text:#EDEBE4; --dim:#93959D; --molten:#FF5A33; --moltenDeep:#C9391A;
    --amber:#FFB020; --sage:#7BD79C;
  }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Inter',sans-serif; }
  html,body{ background:var(--bg); color:var(--text); min-height:100vh; }
  button{ font-family:'Inter',sans-serif; }
  select, input{ font-family:'Inter',sans-serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .display{ font-family:'Oswald',sans-serif; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:99px; }

  .wrap{ max-width:720px; margin:0 auto; padding:40px 20px 80px; }
  .brand{ display:flex; align-items:center; gap:8px; margin-bottom:28px; }
  .brand-mark{ width:26px; height:26px; border-radius:6px; background:linear-gradient(160deg,#FFB020,#FF5A33); }
  .brand-name{ font-size:18px; letter-spacing:.04em; }

  .weekday-tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
  .weekday-tab{ flex:1; min-width:74px; padding:10px 6px; border-radius:8px; background:var(--panel); border:1px solid var(--border); color:var(--dim); cursor:pointer; text-align:center; }
  .weekday-tab.active{ background:var(--molten); color:#fff; border-color:var(--molten); }
  .weekday-tab .wd-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; text-transform:uppercase; }
  .weekday-tab .wd-type{ font-size:9px; margin-top:3px; opacity:.75; }
  .weekday-tab .today-dot{ width:4px; height:4px; border-radius:99px; background:var(--amber); margin:4px auto 0; }
  .weekday-tab.active .today-dot{ background:#fff; }

  .eyebrow{ font-family:'IBM Plex Mono',monospace; color:var(--amber); font-size:11px; letter-spacing:.18em; text-transform:uppercase; margin-bottom:6px; }
  h1.title{ font-family:'Oswald',sans-serif; font-size:28px; font-weight:600; letter-spacing:.01em; text-transform:uppercase; }
  .subtitle{ color:var(--dim); margin-top:6px; font-size:13px; }

  .rest-banner{ margin-top:24px; padding:20px; border-radius:12px; background:var(--panel); border:1px dashed var(--border); color:var(--dim); font-size:14px; text-align:center; }

  .add-panel{ margin-top:24px; padding:14px; border-radius:10px; background:var(--panel); border:1px solid var(--border); }
  .add-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .add-select, .add-input{ flex:1; min-width:120px; padding:8px 10px; border-radius:8px; background:var(--panel2); border:1px solid var(--border); color:var(--text); font-size:13px; outline:none; }
  select.add-select option{ background:var(--panel2); color:var(--text); }
  .btn{ padding:8px 14px; border-radius:8px; border:none; font-size:13px; font-weight:600; cursor:pointer; }
  .btn-molten{ background:var(--molten); color:#fff; }
  .btn-ghost{ background:var(--panel2); color:var(--dim); }
  .toggle-link{ background:none; border:none; color:var(--amber); font-size:12px; cursor:pointer; margin-top:10px; font-family:'IBM Plex Mono',monospace; }
  .custom-form{ margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .custom-form-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .custom-form-row .add-input{ min-width:90px; }

  .section-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); letter-spacing:.1em; text-transform:uppercase; margin:24px 0 10px; }

  .exercise-card{ background:var(--panel); border:1px solid var(--border); border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .exercise-row{ display:flex; align-items:center; gap:14px; padding:12px; cursor:pointer; }
  .pictogram-box{ border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; width:52px; height:52px; background:var(--panel2); }
  .ex-name{ font-size:14px; font-weight:600; }
  .ex-sub{ color:var(--dim); font-size:11px; margin-top:2px; }
  .ex-right{ text-align:right; flex-shrink:0; font-family:'IBM Plex Mono',monospace; }
  .ex-right-main{ color:var(--amber); font-size:15px; font-weight:600; }
  .ex-right-sub{ color:var(--dim); font-size:10px; margin-top:2px; }
  .custom-tag{ font-size:9px; color:var(--amber); border:1px solid var(--amber); border-radius:4px; padding:1px 4px; margin-left:6px; }
  .remove-x{ background:none; border:none; color:var(--dim); font-size:16px; cursor:pointer; padding:0 6px; }

  .exercise-detail{ border-top:1px solid var(--border); padding:16px; }
  .set-table{ border-radius:8px; overflow:hidden; border:1px solid var(--border); }
  .set-head, .set-row{ display:grid; grid-template-columns:0.6fr 1fr 1fr 0.7fr; align-items:center; padding:8px 12px; }
  .set-head{ background:var(--panel2); font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
  .set-row{ background:var(--bg); border-top:1px solid var(--border); }
  .set-num{ font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .set-input{ font-family:'IBM Plex Mono',monospace; padding:4px 6px; border-radius:4px; background:var(--panel2); border:1px solid var(--border); color:var(--amber); font-size:12px; width:85%; }
  .set-done-cell{ display:flex; justify-content:flex-end; }
  .set-check{ display:flex; align-items:center; justify-content:center; border-radius:6px; width:26px; height:26px; background:transparent; border:1.5px solid var(--border); cursor:pointer; color:#14161A; font-weight:700; font-size:12px; }
  .set-check.done{ background:var(--sage); border-color:var(--sage); }

  .timer-card{ margin-top:16px; display:flex; align-items:center; gap:16px; padding:14px; border-radius:10px; background:var(--panel2); flex-wrap:wrap; }
  .timer-ring-wrap{ position:relative; width:64px; height:64px; flex-shrink:0; }
  .timer-text{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; }
  .timer-info{ flex:1; min-width:120px; font-size:12px; color:var(--dim); }
  .timer-btn{ display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:8px; background:var(--molten); color:#fff; border:none; font-size:12px; font-weight:600; cursor:pointer; }
  .timer-btn.resting{ background:var(--panel); color:var(--text); }
  .reset-btn{ background:none; border:none; cursor:pointer; color:var(--dim); font-size:14px; }

  .footnote{ margin-top:32px; font-size:11px; color:var(--dim); line-height:1.5; }
</style>
</head>
<body>
<div class="wrap" x-data="app()" x-init="init()">

  <div class="brand"><div class="brand-mark"></div><span class="display brand-name">FORJA</span></div>

  <div class="weekday-tabs">
    <template x-for="w in weekdays" :key="w.key">
      <button type="button" class="weekday-tab" :class="activeWeekdayKey===w.key ? 'active' : ''" @click="activeWeekdayKey=w.key">
        <div class="wd-label" x-text="w.label"></div>
        <div class="wd-type" x-text="w.type ? dayTypes[w.type].title : 'Descanso'"></div>
        <div class="today-dot" x-show="w.key===todayKey"></div>
      </button>
    </template>
  </div>

  <template x-if="activeType">
    <div>
      <div class="eyebrow" x-text="activeWeekday.label"></div>
      <h1 class="display title" x-text="dayTypes[activeType].title"></h1>
      <p class="subtitle" x-text="activeExercises.length + ' ejercicios · ~' + (activeExercises.length*13) + ' min'"></p>

      <div class="add-panel">
        <div class="add-row">
          <select class="add-select" x-model="libraryPick">
            <option value="">+ Agregar ejercicio de la biblioteca…</option>
            <template x-for="lib in libraryOptions" :key="lib.name">
              <option :value="lib.name" x-text="lib.name + ' · ' + lib.muscleLabel"></option>
            </template>
          </select>
          <button type="button" class="btn btn-molten" :disabled="!libraryPick" @click="addFromLibrary()">Agregar</button>
        </div>

        <button type="button" class="toggle-link" @click="showAddForm=!showAddForm" x-text="showAddForm ? '– Cancelar ejercicio personalizado' : '+ Crear ejercicio personalizado'"></button>

        <div class="custom-form" x-show="showAddForm">
          <div class="custom-form-row">
            <input class="add-input" placeholder="Nombre del ejercicio" x-model="newEx.name">
            <input class="add-input" placeholder="Músculo (ej. Antebrazo)" x-model="newEx.muscleLabel">
          </div>
          <div class="custom-form-row">
            <input class="add-input" type="number" min="1" placeholder="Series" x-model="newEx.sets">
            <input class="add-input" placeholder="Reps (ej. 10 a 12)" x-model="newEx.reps">
            <input class="add-input" placeholder="Peso (ej. 20 kg)" x-model="newEx.weight">
          </div>
          <button type="button" class="btn btn-molten" style="align-self:flex-start" @click="addCustom()">Guardar ejercicio</button>
        </div>
      </div>

      <div class="section-label">Ejercicios de hoy</div>

      <div>
        <template x-for="exr in activeExercises" :key="exr.id">
          <div class="exercise-card" x-data="exerciseCard(exr)">
            <div class="exercise-row" @click="toggleOpen()">
              <div class="pictogram-box" x-html="exr.pictogramSvg"></div>
              <div style="flex:1;min-width:0;">
                <div class="ex-name">
                  <span x-text="exr.name"></span>
                  <span class="custom-tag" x-show="exr.custom">EXTRA</span>
                </div>
                <div class="ex-sub" x-text="exr.muscleLabel + ' · ' + exr.equip"></div>
              </div>
              <div class="ex-right mono">
                <div class="ex-right-main" x-text="doneCount() + '/' + rows.length"></div>
                <div class="ex-right-sub" x-text="exr.reps + ' · ' + exr.weight"></div>
              </div>
              <button type="button" class="remove-x" x-show="exr.custom" @click.stop="$root.removeCustom(exr.id)">×</button>
            </div>

            <div class="exercise-detail" x-show="open" x-collapse>
              <div class="set-table">
                <div class="set-head">Serie<span>Reps</span><span>Peso</span><span style="text-align:right">Hecha</span></div>
                <template x-for="(row, i) in rows" :key="i">
                  <div class="set-row">
                    <div class="set-num mono" x-text="String(i+1).padStart(2,'0')"></div>
                    <input class="set-input" x-model="row.reps">
                    <input class="set-input" x-model="row.weight">
                    <div class="set-done-cell">
                      <button type="button" class="set-check" :class="row.done ? 'done' : ''" @click="toggleSet(i)">
                        <span x-show="row.done">✓</span>
                      </button>
                    </div>
                  </div>
                </template>
              </div>

              <div class="timer-card">
                <div class="timer-ring-wrap">
                  <svg width="64" height="64" style="transform:rotate(-90deg)">
                    <circle cx="32" cy="32" r="27" stroke="#1D1E23" stroke-width="5" fill="none"/>
                    <circle cx="32" cy="32" r="27" stroke="#FF5A33" stroke-width="5" fill="none"
                      :stroke-dasharray="circumference" :stroke-dashoffset="dashOffset()"
                      stroke-linecap="round" style="transition:stroke-dashoffset 1s linear"/>
                  </svg>
                  <div class="timer-text mono" x-text="secondsLeft + 's'"></div>
                </div>
                <div class="timer-info">Descanso entre series · 90s recomendados</div>
                <button type="button" class="timer-btn" :class="resting ? 'resting' : ''" @click="resting ? pause() : start()">
                  <span x-text="resting ? 'Pausar' : 'Iniciar'"></span>
                </button>
                <button type="button" class="reset-btn" @click="reset()">↺</button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>

  <template x-if="!activeType">
    <div class="rest-banner">Domingo — día de descanso. Sin ejercicios programados.</div>
  </template>

  <div class="footnote">
    Los ejercicios agregados se guardan en este navegador (localStorage) y quedan disponibles la próxima vez que abras la página.
    Las series marcadas como hechas se resetean al recargar — pensadas para guiarte durante la sesión, no como historial.
  </div>

</div>

<script>
/* ============== PICTOGRAMA ANATÓMICO ============== */
let gradCounter = 0;
function nextGradId(){ return 'g' + (gradCounter++); }

const PARTS_FRONT = [
  {id:'head',      el:`<circle cx="30" cy="10" r="8" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'neck',      el:`<rect x="27" y="17" width="6" height="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1"/>`},
  {id:'chest',     el:`<path d="M18,21 L42,21 L40,35 L20,35 Z" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'abs',       el:`<path d="M20,35 L40,35 L38,50 L22,50 Z" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'shoulderL', el:`<circle cx="14" cy="23" r="6" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'shoulderR', el:`<circle cx="46" cy="23" r="6" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'bicepL',    el:`<rect x="7" y="27" width="8" height="18" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'bicepR',    el:`<rect x="45" y="27" width="8" height="18" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'forearmL',  el:`<rect x="6" y="45" width="7" height="16" rx="3" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'forearmR',  el:`<rect x="47" y="45" width="7" height="16" rx="3" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'quadL',     el:`<rect x="19" y="50" width="9" height="24" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'quadR',     el:`<rect x="32" y="50" width="9" height="24" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'calfL',     el:`<rect x="20" y="76" width="7" height="20" rx="3" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'calfR',     el:`<rect x="33" y="76" width="7" height="20" rx="3" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
];
const PARTS_BACK = [
  {id:'head',      el:`<circle cx="30" cy="10" r="8" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'neck',      el:`<rect x="27" y="17" width="6" height="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1"/>`},
  {id:'back',      el:`<path d="M16,21 L44,21 L40,44 L20,44 Z" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'shoulderL', el:`<circle cx="14" cy="23" r="6" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'shoulderR', el:`<circle cx="46" cy="23" r="6" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'tricepL',   el:`<rect x="7" y="27" width="8" height="18" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'tricepR',   el:`<rect x="45" y="27" width="8" height="18" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'forearmL',  el:`<rect x="6" y="45" width="7" height="16" rx="3" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'forearmR',  el:`<rect x="47" y="45" width="7" height="16" rx="3" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'glutes',    el:`<path d="M20,44 L40,44 L38,54 L22,54 Z" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'hamL',      el:`<rect x="19" y="54" width="9" height="20" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'hamR',      el:`<rect x="32" y="54" width="9" height="20" rx="4" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'calfL',     el:`<rect x="20" y="76" width="7" height="20" rx="3" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
  {id:'calfR',     el:`<rect x="33" y="76" width="7" height="20" rx="3" fill="__FILL__" stroke="__STROKE__" stroke-width="1.5"/>`},
];
function bodyFigure(view, highlights=[], size=48){
  const gid = nextGradId();
  const parts = view === 'back' ? PARTS_BACK : PARTS_FRONT;
  const shapes = parts.map(p=>{
    const hi = highlights.includes(p.id);
    const fill = hi ? `url(#${gid})` : '#25262C';
    const stroke = hi ? 'none' : '#34353B';
    return p.el.replaceAll('__FILL__', fill).replaceAll('__STROKE__', stroke);
  }).join('');
  const h = Math.round(size * 100 / 60);
  return `<svg viewBox="0 0 60 100" width="${size}" height="${h}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFB020"/><stop offset="100%" stop-color="#FF5A33"/></linearGradient></defs>
    ${shapes}
  </svg>`;
}
function genericIconSvg(){
  return `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#93959D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 6.5l11 11M4 8l3-3M20 16l-3 3M2 12l2-2M20 12l2 2M8.5 4.5l-2 2M15.5 19.5l2-2"/></svg>`;
}

/* ============== DATOS: 3 tipos de día ============== */
function ex(name,muscleLabel,view,highlight,equip,sets,reps,weight){
  return { id:'base_'+name.replace(/\s+/g,'_').toLowerCase(), name, muscleLabel, view, highlight, equip, sets, reps, weight,
    pictogramSvg: bodyFigure(view,highlight,44) };
}

const DAY_TYPES = {
  A: { title:'Pecho, hombro y tríceps', exercises:[
    ex('Press de banca','Pecho','front',['chest'],'Barra',3,'10 a 12','60 kg'),
    ex('Press de banca inclinado','Pecho','front',['chest','shoulderL','shoulderR'],'Mancuernas',3,'10 a 12','22 kg'),
    ex('Elevación lateral','Hombros','front',['shoulderL','shoulderR'],'Mancuernas',3,'10 a 12','10 kg'),
    ex('Desarrollo militar','Hombros','front',['shoulderL','shoulderR'],'Mancuernas',3,'10 a 12','16 kg'),
    ex('Tríceps cuerda','Tríceps','back',['tricepL','tricepR'],'Polea',3,'10 a 12','25 kg'),
    ex('Tríceps francés','Tríceps','back',['tricepL','tricepR'],'Mancuerna',3,'10 a 12','14 kg'),
  ]},
  B: { title:'Espalda y bíceps', exercises:[
    ex('Remada curvada','Espalda','back',['back'],'Mancuerna',3,'10 a 12','24 kg'),
    ex('Remada abierta','Espalda','back',['back'],'Polea',3,'10 a 12','45 kg'),
    ex('Tirada abierta','Espalda','back',['back'],'Polea',3,'10 a 12','50 kg'),
    ex('Rosca directa','Bíceps','front',['bicepL','bicepR'],'Barra',3,'10 a 12','22 kg'),
    ex('Rosca martillo','Bíceps','front',['bicepL','bicepR'],'Mancuernas',3,'10 a 12','14 kg'),
    ex('Rosca scott','Bíceps','front',['bicepL','bicepR'],'Barra Z',3,'10 a 12','20 kg'),
  ]},
  C: { title:'Pierna y hombros', exercises:[
    ex('Hack en cuclillas','Cuádriceps','front',['quadL','quadR'],'Máquina',3,'10 a 12','80 kg'),
    ex('Silla extensora','Cuádriceps','front',['quadL','quadR'],'Máquina',3,'10 a 12','40 kg'),
    ex('Mesa flexora','Isquios','back',['hamL','hamR'],'Máquina',3,'10 a 12','30 kg'),
    ex('Prensa de piernas','Cuádriceps y glúteos','back',['glutes','hamL','hamR'],'Máquina',3,'10 a 12','160 kg'),
    ex('Elevación frontal','Hombros','front',['shoulderL','shoulderR'],'Mancuernas',3,'10 a 12','10 kg'),
    ex('Elevación posterior','Hombros','back',['shoulderL','shoulderR'],'Máquina',3,'10 a 12','20 kg'),
  ]},
};

const WEEKDAYS = [
  {key:'lunes',     label:'Lunes',     type:'A'},
  {key:'martes',    label:'Martes',    type:'B'},
  {key:'miercoles', label:'Miércoles', type:'C'},
  {key:'jueves',    label:'Jueves',    type:'A'},
  {key:'viernes',   label:'Viernes',   type:'B'},
  {key:'sabado',    label:'Sábado',    type:'C'},
  {key:'domingo',   label:'Domingo',   type:null},
];
function todayKeyFn(){
  const map = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
  return map[new Date().getDay()];
}

/* ============== COMPONENTE: ficha de ejercicio (sets + timer) ============== */
function exerciseCard(exr){
  return {
    open:false,
    rows: Array.from({length:exr.sets}, () => ({reps:exr.reps, weight:exr.weight, done:false})),
    restTotal:90, secondsLeft:90, resting:false, timerInterval:null,
    toggleOpen(){ this.open = !this.open; },
    doneCount(){ return this.rows.filter(r=>r.done).length; },
    toggleSet(i){
      this.rows[i].done = !this.rows[i].done;
      if(this.rows[i].done){ this.secondsLeft = this.restTotal; this.start(); }
    },
    get circumference(){ return 2*Math.PI*27; },
    dashOffset(){ return this.resting ? (1 - this.secondsLeft/this.restTotal) * this.circumference : 0; },
    start(){
      clearInterval(this.timerInterval);
      this.resting = true;
      this.timerInterval = setInterval(()=>{
        this.secondsLeft--;
        if(this.secondsLeft <= 0){
          clearInterval(this.timerInterval);
          this.resting = false; this.secondsLeft = this.restTotal;
        }
      }, 1000);
    },
    pause(){ clearInterval(this.timerInterval); this.resting=false; },
    reset(){ this.pause(); this.secondsLeft = this.restTotal; },
  };
}

/* ============== COMPONENTE RAÍZ ============== */
function app(){
  return {
    weekdays: WEEKDAYS,
    dayTypes: DAY_TYPES,
    todayKey: todayKeyFn(),
    activeWeekdayKey: todayKeyFn(),
    customExercises: { A:[], B:[], C:[] },
    showAddForm:false,
    libraryPick:'',
    newEx:{ name:'', muscleLabel:'', sets:3, reps:'10 a 12', weight:'' },

    init(){
      const saved = localStorage.getItem('forja_custom_exercises_v1');
      if(saved){
        try{
          const parsed = JSON.parse(saved);
          // reconstruir el pictograma (no se guarda en localStorage)
          Object.keys(parsed).forEach(type=>{
            parsed[type].forEach(e=>{ e.pictogramSvg = e.highlight && e.highlight.length ? bodyFigure(e.view, e.highlight, 44) : genericIconSvg(); });
          });
          this.customExercises = parsed;
        }catch(e){ /* localStorage corrupto, se ignora */ }
      }
    },
    persist(){
      // no guardamos el SVG (se reconstruye al cargar)
      const toSave = {};
      Object.keys(this.customExercises).forEach(type=>{
        toSave[type] = this.customExercises[type].map(({pictogramSvg, ...rest})=>rest);
      });
      localStorage.setItem('forja_custom_exercises_v1', JSON.stringify(toSave));
    },

    get activeWeekday(){ return this.weekdays.find(w=>w.key===this.activeWeekdayKey); },
    get activeType(){ return this.activeWeekday ? this.activeWeekday.type : null; },
    get activeExercises(){
      if(!this.activeType) return [];
      const base = this.dayTypes[this.activeType].exercises;
      const custom = this.customExercises[this.activeType] || [];
      return [...base, ...custom];
    },
    get libraryOptions(){
      const all = Object.values(this.dayTypes).flatMap(d=>d.exercises);
      const seen = new Set(); const out = [];
      all.forEach(e=>{ if(!seen.has(e.name)){ seen.add(e.name); out.push(e); } });
      const currentNames = new Set(this.activeExercises.map(e=>e.name));
      return out.filter(e=>!currentNames.has(e.name));
    },
    addFromLibrary(){
      if(!this.libraryPick) return;
      const src = this.libraryOptions.find(e=>e.name===this.libraryPick);
      if(!src) return;
      const copy = {...src, id:'custom_'+Date.now(), custom:true};
      if(!this.customExercises[this.activeType]) this.customExercises[this.activeType]=[];
      this.customExercises[this.activeType].push(copy);
      this.persist();
      this.libraryPick='';
    },
    addCustom(){
      if(!this.newEx.name.trim()) return;
      const copy = {
        id:'custom_'+Date.now(),
        name:this.newEx.name.trim(),
        muscleLabel:this.newEx.muscleLabel.trim() || 'Personalizado',
        equip:'Personalizado',
        sets:Number(this.newEx.sets)||3,
        reps:this.newEx.reps || '10 a 12',
        weight:this.newEx.weight || '-',
        view:'front', highlight:[],
        pictogramSvg: genericIconSvg(),
        custom:true,
      };
      if(!this.customExercises[this.activeType]) this.customExercises[this.activeType]=[];
      this.customExercises[this.activeType].push(copy);
      this.persist();
      this.newEx = {name:'',muscleLabel:'',sets:3,reps:'10 a 12',weight:''};
      this.showAddForm=false;
    },
    removeCustom(id){
      this.customExercises[this.activeType] = (this.customExercises[this.activeType]||[]).filter(e=>e.id!==id);
      this.persist();
    },
  };
}
</script>
